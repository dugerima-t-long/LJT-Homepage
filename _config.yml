# Site settings
title: "Junteng Liu"
name: "Junteng Liu"
description: "Junteng Liu's personal academic homepage"
url: "https://dugerima-t-long.github.io"
baseurl: "/LJT-Homepage"
repository: "dugerima-t-long/LJT-Homepage"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Hong_Kong

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: false
      share: false
      related: false
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true

collections:
  publications:
    output: true
    permalink: /publication/:name/

# Author
